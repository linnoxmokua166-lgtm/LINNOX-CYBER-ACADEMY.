
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Student Login | LINNOX CYBER ACADEMY</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            background: #050b08;
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .login-box {
            width: 100%;
            max-width: 430px;
            background: #101a14;
            border: 1px solid #1caa60;
            border-radius: 14px;
            padding: 35px;
            box-shadow: 0 0 25px #08783b33;
        }

        h1 {
            color: #20e879;
            text-align: center;
            margin-bottom: 10px;
        }

        .subtitle {
            color: #aaa;
            text-align: center;
            margin-bottom: 30px;
        }

        h2 {
            color: #20e879;
            margin-bottom: 25px;
            text-align: center;
        }

        label {
            display: block;
            margin: 16px 0 8px;
        }

        input {
            width: 100%;
            padding: 13px;
            background: #07100b;
            border: 1px solid #286442;
            border-radius: 7px;
            color: white;
            outline: none;
        }

        input:focus {
            border-color: #20e879;
        }

        button {
            width: 100%;
            padding: 14px;
            margin-top: 25px;
            background: #20e879;
            color: #061109;
            border: none;
            border-radius: 7px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #12c967;
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        #message {
            text-align: center;
            margin-top: 18px;
            line-height: 1.5;
            color: #20e879;
        }

        .register-link {
            text-align: center;
            margin-top: 25px;
            color: #aaa;
        }

        a {
            color: #20e879;
            text-decoration: none;
        }
    </style>
</head>

<body>

    <div class="login-box">

        <h1>LINNOX CYBER ACADEMY</h1>

        <p class="subtitle">CYBERSECURITY LEARNING PLATFORM</p>

        <h2>Student Login</h2>

        <form id="loginForm">

            <label for="email">Email Address</label>

            <input
                type="email"
                id="email"
                placeholder="Enter your email"
                autocomplete="email"
                required
            >

            <label for="password">Password</label>

            <input
                type="password"
                id="password"
                placeholder="Enter your password"
                autocomplete="current-password"
                required
            >

            <button type="submit" id="loginButton">
                LOGIN TO DASHBOARD
            </button>

        </form>

        <p id="message" role="status"></p>

        <p class="register-link">
            Don't have an account?
            <a href="register.html">Register here</a>
        </p>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase.js"></script>

    <script>
        const loginForm = document.getElementById("loginForm");
        const message = document.getElementById("message");
        const loginButton = document.getElementById("loginButton");

        loginForm.addEventListener("submit", async function(event) {

            event.preventDefault();

            const email = document.getElementById("email").value.trim();
            const password = document.getElementById("password").value;

            loginButton.disabled = true;
            loginButton.textContent = "SIGNING IN...";
            message.textContent = "";

            try {

                const { data, error } =
                    await supabaseClient.auth.signInWithPassword({
                        email: email,
                        password: password
                    });

                if (error) {
                    throw error;
                }

                message.textContent = "Login successful! Opening dashboard...";

                window.location.href = "dashboard.html";

            } catch (error) {

                message.textContent = error.message;

            } finally {

                loginButton.disabled = false;
                loginButton.textContent = "LOGIN TO DASHBOARD";

            }

        });
    </script>

</body>
</html>
